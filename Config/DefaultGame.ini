; GAS is enabled by CoopKitRevive (decision-18). Without this path the Ability System warns on first use and scans all of /Game.
; /CoopKitCombat: the demo cues of CoopKit Combat (hit flash, swing, block). The combat component adds the path at run
; time too; the cues reach a packaged game only through the directory to cook below (TASK-54, decision-59).
[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths=/Game/CoopKitSample
+GameplayCueNotifyPaths=/CoopKitCombat

; Content that nothing references but code loads by path (TASK-54, decision-59). UE 5.5+ never cooks the whole project
; (the NNEDenoiser engine plugin adds its own directory to cook), so the sample lists these itself; with the list UE 5.4
; cooks by references too, the same as 5.5+:
; - the template mannequin (ACKSampleCharacter loads it by path; absent in a fresh clone, see install-mannequins);
; - the demo Gameplay Cues of CoopKit Combat (cues are found by tag, never referenced by an asset).
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins")
+DirectoriesToAlwaysCook=(Path="/CoopKitCombat/Cues")

